<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d8bff"/>
      <stop offset="1" stop-color="#8ec5ff"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e757f"/>
      <stop offset="0.45" stop-color="#f1f3f6"/>
      <stop offset="1" stop-color="#8a919b"/>
    </linearGradient>
    <clipPath id="pill">
      <rect x="23" y="16" width="18" height="42" rx="9"/>
    </clipPath>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#sky)"/>

  <!-- Falling metal-first: plastic on top, metal at the bottom, motion lines trailing above. -->
  <g transform="rotate(-28 32 34)">
    <g stroke="#fff" stroke-width="3.2" stroke-linecap="round" opacity="0.9">
      <line x1="27" y1="3" x2="27" y2="11"/>
      <line x1="32" y1="0" x2="32" y2="11"/>
      <line x1="37" y1="3" x2="37" y2="11"/>
    </g>
    <g clip-path="url(#pill)">
      <rect x="23" y="16" width="18" height="21" fill="#ff9f43"/>
      <rect x="23" y="37" width="18" height="21" fill="url(#metal)"/>
    </g>
    <line x1="23" y1="37" x2="41" y2="37" stroke="#1d2330" stroke-width="1.6"/>
    <rect x="23" y="16" width="18" height="42" rx="9" fill="none" stroke="#1d2330" stroke-width="2.6"/>
  </g>
</svg>
